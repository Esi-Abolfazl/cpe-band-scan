name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-uv floats no v10 tag, so the version is exact; uv reads .python-version itself.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: uv sync --locked --extra dev
      # The three lines below are AGENTS.md § Gates, verbatim.
      - run: uv run pytest -q
      - run: node scripts/check-repo.mjs
      - run: uv run scripts/check_baseline.py
